<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — MIE Postfix</title>
  <style>
    :root { --bg:#f4f6f8; --card:#fff; --border:#e1e4e8; --accent:#0969da; --accent-hover:#0550ae; --text:#1f2328; --muted:#656d76; --danger:#d1242f; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin:0; background:var(--bg); color:var(--text); display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .login-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:2rem 2.2rem; width:100%; max-width:380px; box-shadow:0 4px 16px rgba(0,0,0,0.06); }
    h1 { margin:0 0 0.25rem; font-size:1.5rem; font-weight:600; }
    .subtitle { color:var(--muted); margin-bottom:1.5rem; font-size:0.95rem; }
    label { display:block; margin:0.9rem 0 0.35rem; font-weight:500; font-size:0.9rem; }
    input { width:100%; padding:0.55rem 0.7rem; border:1px solid var(--border); border-radius:6px; font-size:1rem; }
    input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(9,105,218,0.15); }
    button { width:100%; margin-top:1.25rem; padding:0.65rem; background:var(--accent); color:#fff; border:none; border-radius:6px; font-size:1rem; font-weight:500; cursor:pointer; }
    button:hover { background:var(--accent-hover); }
    .error { background:#ffebe9; color:var(--danger); padding:0.6rem 0.8rem; border-radius:6px; margin-bottom:1rem; font-size:0.9rem; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>MIE Postfix</h1>
    <p class="subtitle">Sign in to continue</p>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
      <label>Username</label>
      <input type="text" name="username" required autofocus placeholder="admin">
      <label>Password</label>
      <input type="password" name="password" required>
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
